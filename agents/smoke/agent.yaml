name: smoke
enabled: true
authoredBy: claude-local

trigger:
  type: cron
  # 06:00 daily — inside the overnight window the production quiet-hours
  # setting reserves for agents (spec 7.3). Was every-minute during fake-runner
  # verification; never leave that on with a real runner.
  schedule: "0 6 * * *"
  timezone: Europe/Berlin

run:
  model: claude-haiku-4-5
  effort: low
  # 6 was too tight: a read-modify-write cycle plus one recovered mistake
  # exhausted it and the run died at error_max_turns (measured 2026-08-26).
  maxTurns: 15
  timeoutMinutes: 3
  # Every run pays a fixed ~$0.046 floor: the SDK loads all tool definitions
  # into the system prompt (~22.5k cache-creation tokens, measured 2026-08-26).
  # 0.10 would cut a two-turn run off mid-task.
  maxBudgetUsd: 0.50

permissions:
  # Edit was missing, so appending forced a full-file rewrite and a refused
  # Edit call. Glob earns its place: the agent uses it to locate its workspace.
  allowedTools: [Read, Write, Edit, Glob]
  disallowedTools: [Bash]

tier: sandboxed
approval: notify
grantRefs: []

outbox:
  discord: smoke
  notifyOn: [success, failure]
