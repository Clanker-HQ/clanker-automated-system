name: research
enabled: true
authoredBy: claude-local
description: >-
  Researches a topic on the open web — market opportunities, technical
  questions, whether an idea is any good — and writes up findings.
  Read-and-report only: no code changes, no publishing, no spending.

trigger:
  type: dispatched

run:
  # Sonnet on the PARENT only; the `research-source` subagents that do the
  # actual page reading stay on Haiku (src/runner/sdk-runner.ts). Reading a
  # page and quoting it back is bulk work; weighing sources against each other
  # is where a run goes wrong — a Haiku run reported "duckdns.org is NOT on
  # the Public Suffix List" at high confidence while citing, in its own
  # sources, the Mozilla bug recording the addition. The better model buys
  # judgement, and only pays for it on the few turns that survive once the
  # reading moves into subagents.
  model: claude-sonnet-5
  # low, not medium: at Sonnet's output rate the thinking tokens are the
  # single biggest line item — one run spent 83,772 output tokens, $1.26 of a
  # $2.19 total, 58% of it. Revisit if answers get careless; the careful
  # "medium-high, not freshly re-verified" reasoning this agent started
  # producing is exactly what effort buys, and this is one line to put back.
  effort: low
  # 30 -> 24 (2026-09-01): every turn resends the whole conversation, so a
  # long research run pays again and again for whatever it already fetched.
  # The account's real constraint is the subscription's shared rolling rate
  # limit, not maxBudgetUsd (that figure is priced at API list rates on a
  # subscription billed differently, and isn't the thing actually at risk).
  # 24 still comfortably covers the one real run measured so far (20 turns,
  # 11 WebSearch + 7 WebFetch, achieved its objective) with headroom, while
  # capping how many times a single expensive turn can be re-paid for. That
  # run's 7 direct WebFetch calls were the norm, not the exception, until
  # WebFetch was removed from this agent's own allowedTools below — a single
  # Task dispatch to research-source now absorbs what used to be several
  # direct-fetch turns, so 24 should cover more real work than it used to,
  # not less. Revisit against real runs once some exist under the new tool
  # list rather than assuming this reasoning still holds unchanged.
  maxTurns: 24
  timeoutMinutes: 20
  maxBudgetUsd: 2.00

permissions:
  # `Read` is deliberately absent, and must stay absent. This agent holds a
  # deliberately broad `web-read` grant (urlPattern "*"), so local file access
  # plus that grant would be a straightforward exfiltration path: read a secret
  # off disk, WebFetch it to an attacker-chosen URL, auto-allowed. Nothing this
  # agent legitimately does needs to read local files — it researches the open
  # web and writes its findings out. If a future edit seems to need `Read`,
  # narrow the grant first.
  #
  # `WebFetch` is deliberately absent too, and must stay absent. prompt.md
  # tells this agent to delegate page-reading to a `research-source` subagent
  # specifically so full pages never enter ITS OWN context — every turn
  # resends the whole conversation, so a page read directly is paid for again
  # on every turn after it, while a reader's pages stay in the reader's
  # context and never enter this one. That instruction turned out to be
  # advisory only: real runs show it calling WebFetch directly 7-30+ times
  # per run against 0-6 Task dispatches to research-source — one measured run
  # made 74 direct WebSearch/WebFetch calls against 2 delegated ones and cost
  # $1.72 on 643K largely-uncached input tokens (see the research/token-budget
  # follow-on investigation). Removing the tool from this agent's own list
  # makes delegation the only way to read a page at all, rather than a
  # preference the model was free to skip. `research-source`'s own
  # `tools: ["WebSearch", "WebFetch"]` (RESEARCH_SOURCE_SUBAGENT in
  # src/runner/sdk-runner.ts) is a SEPARATE list scoped to that subagent
  # type, so it keeps WebFetch regardless of what this agent's own
  # permissions say.
  #
  # `Task` does not weaken either restriction: canUseTool refuses any
  # subagent_type this system has not registered, so the only agent this can
  # spawn is `research-source` — WebSearch/WebFetch only, no MCP tools, no
  # Read, and no Task of its own. Without that check the SDK would fall back
  # to its built-in general-purpose agent, which is uncapped and inherits
  # this agent's tools.
  allowedTools: [WebSearch, Write, Task]
  disallowedTools: []

# `autonomous`, not `granted`, because only `tier: autonomous` + `approval: auto`
# short-circuits decide() (src/grants.ts) to `allow` once a grant matches. At
# `tier: granted` a matched grant still returns `park` — this agent would stop
# for a human Discord approval on its very first WebFetch, every single run,
# which defeats the point of a broad auto-approved read-only web grant. The
# containment here is the grant + the tool list, not the tier.
tier: autonomous
approval: auto
grantRefs: [web-read]

outbox:
  discord: ops
  notifyOn: [success, failure]
