name: opportunity-scout
enabled: true
authoredBy: claude-local
description: >-
  Looks for plausible ways this system or its operator could earn money,
  and queues well-scoped research questions for the research specialist to
  investigate. Proposes only — never researches or spends itself.

trigger:
  type: cron
  # daily -> weekly (2026-09-13, operator directive): the operator wants
  # effort concentrated on one product (currently book-pipeline) until it
  # earns money, rather than continuously sourcing new candidates to split
  # attention across. Weekly still keeps the pipeline of ideas alive for
  # when it's time to pick the next one. Soft cadence throttle only —
  # Governor's hard caps (config.yaml) are unchanged.
  schedule: "0 12 * * 1"
  timezone: Europe/Berlin

category: research

run:
  model: claude-haiku-4-5
  effort: low
  maxTurns: 15
  timeoutMinutes: 5
  maxBudgetUsd: 0.50

permissions:
  allowedTools: [WebSearch]
  disallowedTools: []

tier: readonly
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
