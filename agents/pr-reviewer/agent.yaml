name: pr-reviewer
enabled: true
authoredBy: claude-local

trigger:
  type: webhook
  repo: "*"   # any repo either GITHUB_PR_TOKEN (infra-repo grant) or
              # GITHUB_PRODUCTS_TOKEN (products-repo grant) can reach — a
              # webhook still has to exist on each repo (createRepo now
              # registers one automatically for AAS-Labs product repos it
              # creates; clanker-automated-system's was added by hand); this
              # just removes the need to edit this file every time a new
              # repo comes under management
  event: pull_request

run:
  model: claude-sonnet-5
  effort: high
  maxTurns: 60
  timeoutMinutes: 30
  maxBudgetUsd: 3.00

permissions:
  allowedTools: [Read, Write, Edit, Glob, Grep, Bash, Task]
  disallowedTools: []

tier: autonomous
approval: auto
grantRefs: [infra-repo, products-repo]

outbox:
  discord: ops
  notifyOn: [success, failure]
