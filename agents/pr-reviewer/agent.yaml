name: pr-reviewer
enabled: true
authoredBy: claude-local

trigger:
  type: webhook
  repo: "*"   # any repo the GITHUB_PR_TOKEN can reach (a dedicated, single-purpose
              # bot account) — a webhook still has to be added on each repo in
              # GitHub's own settings; this just removes the need to edit this
              # file every time a new repo comes under management
  event: pull_request

run:
  model: claude-sonnet-5
  effort: high
  maxTurns: 60
  timeoutMinutes: 30
  maxBudgetUsd: 3.00

permissions:
  allowedTools: [Read, Write, Edit, Glob, Grep, Bash, Task]
  disallowedTools: []

tier: autonomous
approval: auto
grantRefs: [infra-repo]

outbox:
  discord: smoke
  notifyOn: [success, failure]
