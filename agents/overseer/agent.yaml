name: overseer
enabled: true
authoredBy: claude-local
description: >-
  Reads goals.yaml, the world model, and the previous cycle's graded
  expectations, then writes the next strategy and queues the work it implies.
  Decides only — never implements, merges, or spends.

trigger:
  type: cron
  # ############ TEMPORARY — TEST RUN ONLY, REVERT BEFORE COMMITTING ############
  # Fires once today at 12:58 local so the first overseer cycle can be watched.
  # It will fire again at 12:58 TOMORROW if this is not put back.
  # Restore with: git checkout agents/overseer/agent.yaml
  # Real value: "0 5 * * 1"  (Monday 05:00 — after reflection at 03:00 and
  # metrics at 04:00, so both are fresh)
  schedule: "58 12 * * *"
  # #############################################################################
  timezone: Europe/Berlin

run:
  model: claude-opus-5
  effort: high
  maxTurns: 40
  timeoutMinutes: 30
  maxBudgetUsd: 5.00

permissions:
  allowedTools: [Read, Glob, Grep]
  disallowedTools: []

tier: readonly
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
