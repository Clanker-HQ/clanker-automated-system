name: overseer
enabled: true
authoredBy: claude-local
description: >-
  Reads goals.yaml, the world model, and the previous cycle's graded
  expectations, then writes the next strategy and queues the work it implies.
  Decides only — never implements, merges, or spends.

trigger:
  type: cron
  schedule: "0 11 * * 1"   # Monday 11:00 — after reflection (09:00) and metrics (10:00), so both are fresh
  timezone: Europe/Berlin

run:
  model: claude-opus-5
  effort: high
  maxTurns: 40
  timeoutMinutes: 30
  maxBudgetUsd: 5.00

permissions:
  allowedTools: [Read, Glob, Grep]
  disallowedTools: []

tier: readonly
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
