name: dependency-scout
enabled: true
authoredBy: claude-local
description: >-
  Runs npm audit/outdated against this repo's dependencies and queues
  version-bump tasks for builder, prioritizing known vulnerabilities over
  plain staleness. Proposes only — never installs or edits anything itself.

trigger:
  type: cron
  # daily -> twice monthly (2026-09-13, operator directive): the daily bump on
  # 2026-09-06 was to compensate for the supervisor not always being up during
  # early bring-up. It's now confirmed persistently running, so the original
  # justification is gone, and dependency staleness/vulnerabilities don't
  # change fast enough to need more than the 1st/15th. This is a soft,
  # per-agent cadence throttle, not a change to Governor's hard rate/budget
  # caps (config.yaml), which stay as-is.
  schedule: "15 11 1,15 * *"
  timezone: Europe/Berlin

category: maintain

run:
  model: claude-haiku-4-5
  effort: low
  maxTurns: 25
  timeoutMinutes: 15
  maxBudgetUsd: 1.00

permissions:
  allowedTools: [Bash, Read, Grep]
  disallowedTools: []

tier: sandboxed
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
