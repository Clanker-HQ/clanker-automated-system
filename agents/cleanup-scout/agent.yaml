name: cleanup-scout
enabled: true
authoredBy: claude-local
description: >-
  Audits the repo for stale docs, dead references, and dangling links to
  deleted/renamed files, and hands concrete fixes to builder as tasks.
  Proposes only — never edits anything itself.

trigger:
  type: cron
  schedule: "0 11 * * 1"
  timezone: Europe/Berlin

category: maintain

run:
  model: claude-haiku-4-5
  effort: low
  maxTurns: 40
  timeoutMinutes: 20
  maxBudgetUsd: 1.50

permissions:
  allowedTools: [Read, Glob, Grep]
  disallowedTools: []

tier: readonly
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
