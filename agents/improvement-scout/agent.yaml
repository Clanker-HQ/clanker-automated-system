name: improvement-scout
enabled: true
authoredBy: claude-local
description: >-
  Reads this project's own source and docs, and queues concrete
  improvement/bugfix/capability ideas as tasks for later review. Proposes
  only — never writes or changes anything itself.

trigger:
  type: cron
  # daily -> weekly (2026-09-13, operator directive): this is the biggest
  # single source of new build work on this repo's own codebase, which was
  # skewing PR volume toward the infra repo over the actual products. A soft,
  # per-agent cadence throttle — Governor's hard caps (config.yaml) are
  # unchanged.
  schedule: "0 13 * * 1"
  timezone: Europe/Berlin

category: build

run:
  model: claude-haiku-4-5
  effort: low
  maxTurns: 30
  timeoutMinutes: 15
  maxBudgetUsd: 1.00

permissions:
  allowedTools: [Read, Glob, Grep]
  disallowedTools: []

tier: readonly
approval: notify
grantRefs: []

outbox:
  discord: ops
  notifyOn: [success, failure]
