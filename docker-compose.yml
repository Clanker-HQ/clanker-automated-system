services:
  supervisor:
    build: .
    env_file: .env
    # The webhook receiver (src/index.ts) binds WEBHOOK_PORT inside the
    # container; without publishing it, GitHub's webhook — delivered to the
    # host via a tunnel (ngrok) or a reverse proxy — can never reach it, and
    # no PR would ever be reviewed. Same port inside and out so the tunnel's
    # target matches WEBHOOK_PORT exactly, and the default matches
    # src/index.ts's own fallback of 8787.
    ports:
      - "${WEBHOOK_PORT:-8787}:${WEBHOOK_PORT:-8787}"
    volumes:
      - agent-data:/app/data
      # Read-only: the supervisor reads its own definitions but cannot rewrite
      # them. First physical expression of the privilege boundary (spec §3).
      - ./agents:/app/agents:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./grants.yaml:/app/grants.yaml:ro
      # Read-only reference material improvement-scout's and cleanup-scout's
      # prompts name but the image doesn't bake in: docs/ (decisions.md, for
      # the "already rejected/deferred" guard; system-context.md, read here
      # by the supervisor itself at boot — src/index.ts — and handed to
      # `research` through the systemContext tool, since that agent holds no
      # Read tool at all), README.md, CONFIGURING.md.
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./CONFIGURING.md:/app/CONFIGURING.md:ro
      # cleanup-scout's repo-hygiene audit needs to see infra/test files the
      # Dockerfile never COPYs into the image at all (src/scripts/package.json
      # are baked in and don't need a mount).
      - ./tests:/app/tests:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.github:/app/.github:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.dockerignore:/app/.dockerignore:ro
      # Read-WRITE, unlike every other mount here: the supervisor renders
      # caddy/Caddyfile and caddy/deployments.tsv from deploys.yaml at boot, and
      # both the caddy container and the host's deploy script read them
      # directly. A named volume would put them somewhere the host script can
      # only reach by digging into /var/lib/docker.
      - ./caddy:/app/caddy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The DIRECTORY, not ./caddy/Caddyfile itself. A bind mount whose host
      # path does not exist yet makes Docker create a DIRECTORY at that path,
      # and a directory named Caddyfile fails in a way that reads as a Caddy
      # bug rather than a missing file. caddy/ always exists (.gitkeep); the
      # Caddyfile inside it does not, until the supervisor writes it.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-data:
  caddy-data:
  caddy-config:
