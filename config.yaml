governor:
  # 2 -> 1 (2026-09-02). The binding constraint is the subscription's rolling
  # rate-limit window, not money, and concurrency sets how fast that window is
  # spent. The first overseer cycle queued three research tasks; two ran at
  # once and exhausted a five-hour window within minutes. Serial runs consume
  # the same total but spread it, and — the part concurrency actually broke —
  # they let the rate-limit snapshot update BETWEEN runs, so the utilization
  # gate below can act on a fresh reading instead of admitting several runs
  # that all passed the same stale one.
  maxConcurrent: 1
  dailyBudgetUsd: 40
  pendingTimeoutHours: 24
  # admit() refuses ALL new work — trigger or resume — once the account's
  # rolling rate-limit window (see !status / data/state/rate-limit.json)
  # reaches this fraction. Status alone ("allowed_warning" vs "rejected")
  # isn't a usable signal on its own: the account can sit at
  # allowed_warning for days while utilization keeps climbing, and nothing
  # read the number at all until this field existed.
  # 0.95 -> 0.80 (2026-09-02). 0.95 leaves no room to stop: a single research
  # run moves enough of the window that the account can go from under the
  # threshold to rejected without any reading in between, because the snapshot
  # only refreshes when a run reports one. Stopping at 0.80 leaves roughly one
  # run's worth of headroom, which is what makes this a brake rather than a
  # record of having already hit the wall.
  rateLimitPauseThreshold: 0.80
  # Local development: agents run at almost any hour; the window is nominal.
  quietHours: { from: "02:00", to: "03:00", timezone: Europe/Berlin }
  # Production (VPS): agents work overnight, standing down while the owner
  # is awake and using Claude interactively. Swap the two lines on deploy.
  # quietHours: { from: "10:00", to: "22:00", timezone: Europe/Berlin }

discord:
  channels:
    ops: DISCORD_WEBHOOK_OPS   # webhook URL — routine reports (outbox)
  botChannels:
    ops: DISCORD_CHANNEL_ID_OPS   # numeric Discord channel id, for the bot

digest:
  enabled: true
  schedule: "0 14 * * *"   # once a day, croner's 5-field cron syntax
  timezone: Europe/Berlin
  channel: ops            # a key into discord.channels above

retention:
  enabled: true
  days: 30                # delete run transcripts/results and workspace files older than this
  schedule: "0 10 * * 0"   # weekly (Sunday 10:00) — bulk deletion, not routine reporting
  timezone: Europe/Berlin
  channel: ops

# Which merchant-of-record API REVENUE_API_TOKEN belongs to. Written out
# explicitly rather than left to the schema default: picking the wrong one
# does not error, it reports $0 income forever (see src/index.ts).
#
# "stripe", not "lemonsqueezy": Stripe acquired Lemon Squeezy, and new
# signups now land on Stripe Managed Payments — Stripe's own dashboard and
# API (a normal Stripe secret key, the ordinary Charges API), not Lemon
# Squeezy's separate JSON:API. Managed Payments explicitly does not support
# the Connect-style setup that would route through Lemon Squeezy's surface.
revenue:
  provider: stripe   # lemonsqueezy | stripe

metrics:
  enabled: true
  schedule: "0 10 * * 1"   # weekly (Monday 10:00) — one hour after memory.reflectionSchedule
  timezone: Europe/Berlin
  windowDays: 7

# Explicit override — without this block the schema default (0 3 * * 1,
# timezone UTC) applies, which drifts against every other Europe/Berlin
# schedule below whenever CEST/CET disagree with UTC by more than the
# nominal 1-hour offset baked into the comments here. Local development
# runs whenever the operator's machine happens to be on, so 09:00 Berlin —
# not 03:00 UTC — is when this and the rest of the weekly Monday chain
# (metrics 10:00, overseer/cleanup-scout 11:00) actually have a chance to
# fire.
memory:
  reflectionSchedule: "0 9 * * 1"   # weekly (Monday 09:00)
  reflectionTimezone: Europe/Berlin

deploy:
  maxLiveDeployments: 5
  # Names only — values live in the host's product env file and never enter
  # the supervisor's container. Extending this list is an operator edit by
  # construction: config.yaml is on EXCLUDED_PATHS.
  availableProductEnv: []

