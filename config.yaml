governor:
  maxConcurrent: 2
  dailyBudgetUsd: 10
  pendingTimeoutHours: 24
  # Local development: agents run at almost any hour; the window is nominal.
  quietHours: { from: "02:00", to: "03:00", timezone: Europe/Berlin }
  # Production (VPS): agents work overnight, standing down while the owner
  # is awake and using Claude interactively. Swap the two lines on deploy.
  # quietHours: { from: "10:00", to: "22:00", timezone: Europe/Berlin }

discord:
  channels:
    smoke: DISCORD_WEBHOOK_SMOKE   # webhook URL — routine reports (outbox)
  botChannels:
    smoke: DISCORD_CHANNEL_ID_SMOKE   # numeric Discord channel id, for the bot

digest:
  enabled: true
  schedule: "0 8 * * *"   # once a day, croner's 5-field cron syntax
  timezone: Europe/Berlin
  channel: smoke          # a key into discord.channels above

retention:
  enabled: true
  days: 30                # delete run transcripts/results and workspace files older than this
  schedule: "0 4 * * 0"   # weekly (Sunday 04:00) — bulk deletion, not routine reporting
  timezone: Europe/Berlin
  channel: smoke

# github:
#   prToken: GITHUB_PR_TOKEN   # (documented here for discoverability; the
#                               # env var itself is read directly, not via
#                               # a config.yaml key, since it's a single
#                               # global credential, not per-channel)
