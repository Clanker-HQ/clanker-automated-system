grants:
  - id: test-echo
    kind: http
    method: POST
    urlPattern: "https://httpbin.org/post"
    secret: TEST_ECHO_TOKEN

  # Backs agents/pr-reviewer's grantRefs. GITHUB_PR_TOKEN is a fine-grained
  # PAT on a dedicated, single-purpose bot account, scoped to "all
  # repositories" on that account with ONLY Contents:Read and Pull
  # requests:Read&write — no Administration, no billing, no other-account
  # access. `repos: "*"` here matches that token's own scope: authority is
  # bounded by what the token can reach, not by an allowlist duplicated in
  # this file. A repo not yet under this account cannot be merged into
  # regardless of this setting; a repo added to the account still needs its
  # own webhook configured on GitHub's side (Settings → Webhooks) before
  # this pipeline ever sees an event from it.
  # NOTE (2026-08-30): `repos` was "*" while GITHUB_PR_TOKEN was a narrow PAT
  # whose own scope was the real bound. It is now an explicit list, because
  # matchGrant uses `grants.find` — FIRST MATCH WINS — and a "*" here would
  # match a pull_request on an AAS-Labs repo before products-repo below ever
  # got the chance, handing it GITHUB_PR_TOKEN, which cannot reach that org.
  # The failure would surface as an opaque GitHub 404, not as a grant error.
  # `repos` is matched by exact list membership (not glob), so a new
  # Clanker-HQ repo that should be reviewable has to be added here by hand.
  - id: infra-repo
    kind: github-pr
    repos: ["Clanker-HQ/clanker-automated-system"]
    secret: GITHUB_PR_TOKEN

  # Backs agents/research's grantRefs. Read-only web access (WebFetch to
  # arbitrary URLs) is a deliberately broad, low-risk grant: reading a public
  # page carries none of the "spend money / do something irreversible"
  # character the owner reserves for personal approval, unlike a git-push or
  # provision grant. `method`/`secret` are schema-required fields, checked
  # for well-formedness at boot only and not otherwise consulted at match
  # time (see the existing test-echo grant, and README's documented caveat
  # about method/branches/limit.perDay) — WEB_READ_TOKEN does not need to be
  # set in .env.
  - id: web-read
    kind: http
    method: GET
    urlPattern: "*"
    secret: WEB_READ_TOKEN

  # Backs agents/builder's grantRefs. BUILDER_PUSH_TOKEN is a fine-grained
  # PAT on the same dedicated bot account infra-repo uses, scoped to
  # Contents:Write + Pull requests:Write on this repo only — broader than
  # infra-repo's Contents:Read, so it's a separate token, not a reused one.
  # branches restricts this grant to the agent/builder/ namespace as real,
  # enforced scope (see matchGrant's extended git-push case) — pushBranch's
  # own hardcoded regex enforces the same boundary unconditionally, so a
  # typo here narrows nothing that matters, but widens nothing dangerous
  # either.
  - id: builder-push
    kind: git-push
    remote: "Clanker-HQ/clanker-automated-system"
    branches: ["agent/builder/*"]
    secret: BUILDER_PUSH_TOKEN

  # ---------------------------------------------------------------------
  # AAS-Labs — where the system builds revenue products. Deliberately the
  # unrestricted half of the split: GITHUB_PRODUCTS_TOKEN is a fine-grained
  # PAT whose resource owner is the AAS-Labs org, holding EVERY repository
  # and organization permission including Administration. Verified
  # 2026-08-30 to create and delete repos there (201/204), and verified
  # unable to administer Clanker-HQ/clanker-automated-system (403).
  #
  # Maximum permissions are safe here because a fine-grained token cannot
  # reach outside its resource owner — the confinement is structural, not a
  # matter of which boxes were ticked. The infrastructure repo, and the
  # ruleset protecting it, are simply not addressable by this credential.
  # ---------------------------------------------------------------------

  # Must come AFTER infra-repo: this is the catch-all "*" for github-pr, and
  # matchGrant takes the first match. Its "*" is bounded the way infra-repo's
  # used to be — by what the token behind it can actually reach, which is
  # AAS-Labs and nothing else. AAS-Labs repos are created by the system at
  # runtime, so they cannot be enumerated in a list the way infra-repo's are.
  - id: products-repo
    kind: github-pr
    repos: "*"
    secret: GITHUB_PRODUCTS_TOKEN

  # `branches` says agent/builder/* rather than "*" because that is what is
  # actually enforceable: pushBranch hardcodes /^agent\/builder\// at
  # src/runner/sdk-runner.ts:475 and mergePR re-checks the head ref at :545,
  # unconditionally, for every repo — no grant can widen it. Writing "*" here
  # would promise freedom the code refuses to deliver. Widening it means
  # editing sdk-runner.ts, which is on EXCLUDED_PATHS and therefore always a
  # human edit. In practice this costs nothing: products are still built via
  # branch -> PR -> merge, only the branch names are namespaced.
  - id: products-push
    kind: git-push
    remote: "AAS-Labs/*"
    branches: ["agent/builder/*"]
    secret: GITHUB_PRODUCTS_TOKEN

  # Backs agents/builder's grantRefs — the createRepo tool's grant.
  # ProvisionGrant.resource "github-repo" has been in the schema since it was
  # written, with nothing ever producing an OutwardEffect that matched it
  # until createRepo (src/runner/sdk-runner.ts); this is that grant. Reuses
  # GITHUB_PRODUCTS_TOKEN rather than adding a new credential — the same
  # token already backs products-repo and products-push above, and its own
  # comment already documents it as verified able to create (and delete)
  # repos in AAS-Labs and structurally unable to reach anywhere else.
  # `scope: "AAS-Labs"` matches exactly, not "AAS-Labs/*": createRepo's
  # detectOutwardEffect case reports the effect target as the bare org (not
  # "org/name") — the repo doesn't exist yet to have a path of its own — and
  # matchGrant's provision case runs `scope` through globMatch against that
  # target, so an exact org string is what actually matches here.
  # `limit.perDay: 2` is deliberately low: a runaway repo-creation loop is a
  # real failure mode worth bounding on paper, even though nothing in this
  # codebase counts uses against a provision grant's limit yet (see README's
  # documented caveat) — the real backstop today is that every repo this
  # creates still needs a human-reviewable PR (via pushBranch/openPR, gated
  # separately by products-push) before anything meaningful lands in it.
  - id: products-provision
    kind: provision
    resource: github-repo
    scope: "AAS-Labs"
    limit: { perDay: 2 }
    secret: GITHUB_PRODUCTS_TOKEN
